server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: escala-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
logging:
  level:
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  openapi:
    enabled: ${OPENAPI_ENABLED:true}
    include-admin: ${OPENAPI_INCLUDE_ADMIN:true}

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION_MS:900000}
      refresh-token:
        expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
    recaptcha:
      secret: ${RECAPTCHA_SECRET:}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      price-essential: ${STRIPE_PRICE_ESSENTIAL:}
      price-professional: ${STRIPE_PRICE_PROFESSIONAL:}
      price-critical: ${STRIPE_PRICE_CRITICAL:}
  integrations:
    strapi:
      base-url: ${STRAPI_BASE_URL}
  locks:
    schedule-generate-ttl: ${SCHEDULE_GENERATE_LOCK_TTL:PT2M}
    schedule-cycle-ttl: ${SCHEDULE_CYCLE_LOCK_TTL:PT1M}

---
spring:
  config:
    activate:
      on-profile: development
  jpa:
    hibernate:
      ddl-auto: update

---
spring:
  config:
    activate:
      on-profile: homolog
  jpa:
    hibernate:
      ddl-auto: validate

---
spring:
  config:
    activate:
      on-profile: production
  jpa:
    hibernate:
      ddl-auto: validate
app:
  openapi:
    enabled: false
    include-admin: false

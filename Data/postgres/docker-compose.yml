services:
  postgres:
    container_name: escala-postgres
    build:
      context: .
      dockerfile: Docker/develop/Dockerfile
    image: escala-postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - escala_pg_data:/var/lib/postgresql/data/
      - ./init-multiple-databases.sh:/docker-entrypoint-initdb.d/10-init-multiple-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      escala-network:
volumes:
  escala_pg_data:

networks:
  escala-network:
    external: true
